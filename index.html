<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
    >
  </head>
  <body class="body">
    <aside class="details">
      <img class="details__img"
      src="./eisenhower-matrix.jpg"
      alt="Eisenhower Matrix diagram"
      >
      <a
        class="details__a"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </aside>
    <article class="todo-list">
      <h1 class="todo-list__h1">TODO-list</h1>
      <section id="add-tasks">
        <h2 class="todo-list__sct-h">Add Item</h2>
        <form
        class="add-task-form"
        onsubmit="event.preventDefault()"
        >
          <input
            id="new-task"
            class="add-task-form__name-input"
            type="text"
          >
          <button class="add-task-form__add-btn">Add</button>
        </form>
      </section>
      <section>
        <h2 class="todo-list__sct-h">Todo</h2>
        <ul id="incomplete-tasks">
          <li class="task">
            <input
            type="checkbox"
            class="task__is-complete-input"
            >
            <label class="task__name-label">Pay Bills</label>
            <input type="text" class="task__name-input">
            <button class="task__edit-btn">Edit</button>
            <button class="task__del-btn">
              <img
              class="task__remove-icon"
              src="./remove.svg"
              alt="Remove task"
              >
            </button>
          </li>
          <li class="task_edit-mode task">
            <input
            type="checkbox"
            class="task__is-complete-input"
            >
            <label class="task__name-label">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="task__name-input"
            >
            <button class="task__edit-btn">Save</button>
            <button class="task__del-btn">
              <img
              class="task__remove-icon"
              src="./remove.svg"
              alt="Remove task"
              >
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="todo-list__sct-h">Completed</h2>
        <ul id="completed-tasks">
          <li class="task">
            <input
            type="checkbox"
            class="task__is-complete-input"
            checked
            >
            <label class="task__name-label">See the Doctor</label>
            <input type="text" class="task__name-input">
            <button class="task__edit-btn">Edit</button>
            <button class="task__del-btn">
              <img
              class="task__remove-icon"
              src="./remove.svg"
              alt="Remove task"
              >
            </button>
          </li>
        </ul>
      </section>
    </article>
    <script src="app.js"></script>
  </body>
</html>
